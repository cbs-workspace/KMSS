<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kings Metro School — Portal</title>
  <style>
    :root {
      --emerald: #059669; --emerald-dark: #047857; --emerald-light: #d1fae5;
      --slate-900: #0f172a; --slate-800: #1e293b; --slate-700: #334155; --slate-500: #64748b;
      --slate-400: #94a3b8; --slate-300: #cbd5e1; --slate-200: #e2e8f0; --slate-100: #f1f5f9;
      --slate-50: #f8fafc; --red: #dc2626; --amber: #d97706;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--slate-900); background: var(--slate-100); font-size: 14px; }
    a { color: var(--emerald-dark); text-decoration: none; } a:hover { text-decoration: underline; }
    button { font: inherit; cursor: pointer; } input, select, textarea { font: inherit; }
    .layout { display: flex; min-height: 100vh; min-height: 100dvh; }
    .sidebar { width: 256px; background: var(--slate-900); color: var(--slate-100); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--slate-800); }
    .sidebar-brand img { width: 44px; height: 44px; border-radius: 999px; background: #fff; object-fit: contain; padding: 2px; }
    .logo-fallback { width: 44px; height: 44px; border-radius: 999px; background: var(--emerald); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }
    .sidebar-brand .name { color: #34d399; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: 13px; }
    .sidebar-brand .sub { color: var(--slate-400); font-size: 12px; }

    .nav button { text-align: left; background: transparent; border: 0; color: var(--slate-300); padding: 9px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; }
    .nav button:hover { background: var(--slate-800); }
    .nav button.active { background: var(--emerald); color: #fff; }
    .sidebar-foot { border-top: 1px solid var(--slate-800); padding: 14px 20px; color: var(--slate-400); font-size: 12px; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid var(--slate-200); padding: 12px 24px; }
    .topbar .who { font-weight: 600; } .topbar .mail { color: var(--slate-500); font-size: 12px; }
    .content { flex: 1; padding: 24px; } .content-inner { max-width: 1200px; margin: 0 auto; }
    .footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--slate-200); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }

    .footer.dark { border-color: var(--slate-700); } .footer.dark .text { color: var(--slate-400); }
    .card { background: #fff; border: 1px solid var(--slate-200); border-radius: 12px; padding: 20px; } .card + .card { margin-top: 20px; }
    .grid { display: grid; gap: 16px; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }

    label { display: block; font-size: 13px; font-weight: 600; color: var(--slate-700); margin-bottom: 4px; }
    .field { margin-bottom: 14px; }
    input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--slate-300); border-radius: 8px; background: #fff; outline: none; }

    textarea { min-height: 90px; resize: vertical; }
    input[type=file] { padding: 6px; }

    .btn-primary { background: var(--emerald); color: #fff; } .btn-primary:hover { background: var(--emerald-dark); }
    .btn-outline { background: #fff; border-color: var(--slate-300); color: var(--slate-700); } .btn-outline:hover { background: var(--slate-100); }
    .btn-danger { background: #fff; border-color: #fecaca; color: var(--red); } .btn-danger:hover { background: #fef2f2; }
    .btn-ghost { background: transparent; color: var(--emerald-dark); }

    .badge.ok { background: var(--emerald-light); color: var(--emerald-dark); } .badge.warn { background: #fef3c7; color: var(--amber); }

    tbody td { padding: 9px 12px; border-bottom: 1px solid var(--slate-100); } tbody tr:hover { background: var(--slate-50); }
    .table-wrap { overflow: hidden; border: 1px solid var(--slate-200); border-radius: 12px; background: #fff; } .table-wrap table { border: 0; }

    .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--slate-200); margin-bottom: 16px; flex-wrap: wrap; }
    .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; color: var(--slate-500); font-weight: 600; }
    .tabs button.active { color: var(--emerald-dark); border-bottom-color: var(--emerald); }
    .stat { background: #fff; border: 1px solid var(--slate-200); border-radius: 12px; padding: 18px; }
    .stat .label { color: var(--slate-500); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .stat .value { font-size: 28px; font-weight: 700; margin-top: 6px; }

    .login-card { width: 100%; max-width: 420px; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
    .login-card .head { text-align: center; margin-bottom: 20px; } .login-card .head img { height: 84px; width: 84px; object-fit: contain; margin-bottom: 10px; }
    .login-card .kicker { color: var(--emerald); text-transform: uppercase; letter-spacing: .18em; font-size: 11px; font-weight: 700; }
    .login-card h1 { font-size: 22px; margin: 4px 0; }
    .login-footer { width: 100%; max-width: 420px; margin-top: 16px; }

    .report-head img { height: 72px; width: 72px; object-fit: contain; }
    .report-head .school { font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; text-align: center; }
    .report-head .subtitle { text-align: center; color: var(--slate-500); font-size: 12px; }

    .report-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }

    .report-table tbody td { border: 1px solid var(--slate-200); padding: 8px 10px; }
    .report-table tbody tr:nth-child(even) td { background: var(--slate-50); }
    .report-table .report-total td { background: var(--emerald-light); font-weight: 600; }
    .report-remarks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .remark-box { border: 1px solid var(--slate-200); border-radius: 10px; padding: 12px 14px; min-height: 84px; }
    .remark-box .sign { margin-top: 26px; border-top: 1px dashed var(--slate-300); padding-top: 6px; font-size: 11px; color: var(--slate-500); text-align: right; }
    .report-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--slate-100); }

    .report-meta .kv .k { color: var(--slate-500); font-size: 12px; } .report-meta .kv .v { font-weight: 600; }
    .report-summary { display: flex; gap: 28px; flex-wrap: wrap; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--slate-300); border-top-color: var(--emerald); border-radius: 999px; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 60px; color: var(--slate-500); }
    .seg { display: inline-flex; border: 1px solid var(--slate-300); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; background: #fff; padding: 6px 10px; font-size: 12px; color: var(--slate-600); border-right: 1px solid var(--slate-200); }
    .seg button:last-child { border-right: 0; } .seg button.on { background: var(--emerald); color: #fff; }
    .seg button.on[data-status=ABSENT] { background: var(--red); } .seg button.on[data-status=LATE] { background: var(--amber); }
    .thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--slate-100); }
    .ph { width: 40px; height: 40px; border-radius: 6px; background: var(--slate-200); display: inline-block; }
    /* ---- dashboard ---- */

    .dash-hero h2 { margin: 0; font-size: 22px; }

    .dash-hero .scope { background: rgba(255,255,255,.18); padding: 5px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .cards { display: grid; gap: 16px; grid-template-columns: repeat(4, minmax(0,1fr)); margin-top: 20px; }
    @media (max-width: 1100px) { .cards { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
    .stat-card { background: #fff; border: 1px solid var(--slate-200); border-radius: 14px; padding: 16px; display: flex; gap: 14px; align-items: center; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    .stat-card .ico { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--emerald-light); color: var(--emerald-dark); flex-shrink: 0; }
    .stat-card .lbl { color: var(--slate-500); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .stat-card .val { font-size: 26px; font-weight: 700; line-height: 1.15; }
    .stat-card .sub { color: var(--slate-500); font-size: 12px; }
    .bars { display: flex; flex-direction: column; gap: 14px; }
    .bar-row .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .bar { height: 10px; background: var(--slate-100); border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; border-radius: 999px; background: var(--emerald); transition: width .3s ease; }
    .bar.kg > span { background: #7c3aed; } .bar.primary > span { background: #2563eb; } .bar.secondary > span { background: #059669; } .bar.plain > span { background: var(--slate-400); }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--slate-100); color: var(--slate-700); }
    .pill.present { background: var(--emerald-light); color: var(--emerald-dark); } .pill.absent { background: #fee2e2; color: var(--red); } .pill.late { background: #fef3c7; color: var(--amber); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; flex-wrap: wrap; }
    .section-head h3 { margin: 0; font-size: 15px; }
    .search-wrap input { padding: 11px 14px; }

    .dir-item:last-child { border-bottom: 0; }
    .dir-head { margin-top: 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--slate-500); }

    .kv-big .v { font-size: 22px; font-weight: 700; }

    .sidebar-backdrop { display: none; }
    .topbar .tb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }

      body.nav-open .sidebar { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,.5); }

    /* ---- fees ---- */
    .fee-sheet { border: 1px solid var(--slate-200); border-radius: 12px; background: #fff; overflow: hidden; }

    .fee-item:last-child { border-bottom: 0; }
    .fee-item input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--emerald); flex-shrink: 0; }
    .fee-item .amt { margin-left: auto; font-weight: 700; white-space: nowrap; }
    .fee-items { border-top: 1px solid var(--slate-100); }

    .receipt .r-title { text-align: center; margin: 2px 0 14px; }

    .receipt .r-foot { font-size: 12px; color: var(--slate-500); text-align: center; margin-top: 14px; }

      #print-area { display: block !important; }

    @media print { .sidebar, .topbar, .toolbar, .no-print, .tabs, .dash-hero, .cards, .search-wrap, .nav-toggle, .sidebar-backdrop { display: none !important; } body { background: #fff; } .content { padding: 0; } .card { border: 0; padding: 0; } .footer { border-top: 1px solid #ccc; } }
  </style>

<body>

  <div id="print-area"></div>
  <script>

      students: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',

        state.notice = 'Password changed. Please sign in again.';
        render();
      }).catch(function (err) { state.busy = false; setError(err); });
    }

    /* ---------------- announcements ---------------- */
    function loadAnnouncements() { state.busy = true; render(); authed('api_listAnnouncements').then(function (list) { state.announcements.list = list; state.busy = false; render(); }).catch(function (err) { state.busy = false; setError(err); }); }
    function viewAnnouncements() {
      var a = state.announcements, canPost = roleAllowed(['ADMIN', 'PRINCIPAL', 'HEADMASTER', 'BURSAR', 'ACCOUNT_OFFICER', 'TEACHER']), body = '';
      if (canPost) {
        body += '<div class="toolbar no-print"><div class="spacer"></div><button class="btn btn-primary" data-action="ann-new">+ New announcement</button></div>';
        if (a.form) body += '<div class="card"><form id="ann-form"><div class="field"><label>Title</label><input name="title" type="text" required></div>' +
          '<div class="grid cols-2"><div class="field"><label>Audience</label><select name="audience">' + state.boot.audiences.map(function (x) { return '<option value="' + x + '">' + x + '</option>'; }).join('') + '</select><div class="muted small" style="margin-top:4px">Choose <strong>WEBSITE</strong> to show this on the public site marquee.</div></div>' +
          '<div class="field"><label>Label <span class="muted small">(optional badge)</span></label><input name="category" type="text" placeholder="Announcement"></div></div>' +
          '<div class="field"><label>Message</label><textarea name="body" required></textarea></div>' +
          '<div class="field"><label>Link <span class="muted small">(optional)</span></label><input name="link" type="url" placeholder="https://"></div>' +
          '<div class="row"><button class="btn btn-primary" type="submit">Post</button><button class="btn btn-outline" type="button" data-action="cancel-ann">Cancel</button></div></form></div>';
      }
      if (state.busy) return body + '<div class="page-loading"><span class="spinner"></span> Loading…</div>';
      if (!a.list.length) return body + '<div class="empty">No announcements yet.</div>';
      return body + a.list.map(function (item) { return '<div class="card" style="margin-bottom:14px"><div class="row"><strong>' + esc(item.title) + '</strong><span class="badge">' + esc(item.audience) + '</span>' + (item.category ? ' <span class="badge">' + esc(item.category) + '</span>' : '') + '<div class="spacer"></div><span class="muted small">' + esc(String(item.createdAt).slice(0, 10)) + '</span>' + (roleAllowed(['ADMIN', 'PRINCIPAL', 'HEADMASTER']) ? ' <button class="btn btn-danger btn-sm" data-action="ann-delete" data-id="' + esc(item.id) + '">Delete</button>' : '') + '</div><p style="margin:10px 0 0">' + esc(item.body) + '</p>' + (item.link ? '<p style="margin:8px 0 0"><a href="' + esc(item.link) + '" target="_blank" rel="noreferrer">' + esc(item.link) + '</a></p>' : '') + '</div>'; }).join('');
    }

    /* ---------------- events ---------------- */
    document.addEventListener('click', function (e) {
      var nav = e.target.closest('[data-nav]');
      if (nav) { document.body.classList.remove('nav-open'); navigate(nav.getAttribute('data-nav')); return; }
      var el = e.target.closest('[data-action]'); if (!el) return;
      var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
      switch (a) {
        case 'toggle-nav': document.body.classList.toggle('nav-open'); return;
        case 'close-nav': document.body.classList.remove('nav-open'); return;
        case 'signout': authed('api_logout').catch(function () {}); state.token = ''; state.user = null; state.boot = null; sessionStorage.removeItem('kms_token'); clearMessages(); document.body.classList.remove('nav-open'); render(); return;
        case 'student-new': state.students.form = { classArmId: state.students.classArmId, status: 'ACTIVE' }; clearMessages(); render(); return;
        case 'cancel-student': state.students.form = null; render(); return;
        case 'student-edit': var st = findIn(state.students.list, id); if (st) { state.students.form = JSON.parse(JSON.stringify(st)); clearMessages(); render(); } return;
        case 'student-delete': if (confirm('Delete this student?')) act(authed('api_deleteStudent', id), 'Student deleted.', loadStudents); return;
        case 'att-status': setAttStatus(el.getAttribute('data-sid'), el.getAttribute('data-status')); return;
        case 'attendance-save': saveAttendance(); return;
        case 'res-tab': state.results.tab = el.getAttribute('data-tab'); clearMessages(); loadResults(); return;
        case 'scores-save': saveScores(); return;
        case 'grades-save': saveGrades(); return;
        case 'results-compute': act(authed('api_computeResults', state.results.classArmId, state.results.termId), 'Results computed.', function () { state.results.tab = 'sheets'; loadResults(); }); return;
        case 'results-publish': if (confirm('Publish results for this class/term?')) act(authed('api_publishResults', state.results.classArmId, state.results.termId, true), 'Results published.', loadResults); return;
        case 'open-report': case 'open-report-ward': state.report.studentId = id; state.report.termId = state.results.termId; navigate('reportcard'); return;
        case 'back-results': navigate(state.user.role === 'PARENT' ? 'my-wards' : 'results'); return;
        case 'print-report': window.print(); return;
        case 'staff-new': state.staff.form = { status: 'ACTIVE' }; clearMessages(); render(); return;
        case 'cancel-staff': state.staff.form = null; render(); return;
        case 'staff-edit': var sf = findIn(state.staff.list, id); if (sf) { state.staff.form = JSON.parse(JSON.stringify(sf)); clearMessages(); render(); } return;
        case 'staff-delete': if (confirm('Delete this staff record?')) act(authed('api_deleteStaff', id), 'Staff deleted.', loadStaff); return;
        case 'teacher-new': state.teachers.form = {}; state.teachers.flash = null; clearMessages(); render(); return;
        case 'teacher-cancel': state.teachers.form = null; render(); return;
        case 'teacher-edit': var te = findIn(state.teachers.list, id); if (te) { state.teachers.form = JSON.parse(JSON.stringify(te)); state.teachers.flash = null; clearMessages(); render(); } return;
        case 'teacher-activate': act(authed('api_setTeacherActive', id, true), 'Teacher activated.', loadTeachers); return;
        case 'teacher-deactivate': var td = findIn(state.teachers.list, id); if (td && confirm('Deactivate ' + td.username + '? They will be signed out and unable to sign in.')) act(authed('api_setTeacherActive', id, false), 'Teacher deactivated.', loadTeachers); return;
        case 'teacher-reset': var tr = findIn(state.teachers.list, id); if (tr && confirm('Send ' + tr.username + ' a new password? Their current sessions will be ended.')) { state.busy = true; clearMessages(); render(); authed('api_resetTeacherPassword', id).then(function (r) { state.teachers.flash = { message: r.message, password: r.password || '' }; state.busy = false; loadTeachers(); }).catch(function (err) { state.busy = false; setError(err); }); } return;
        case 'application-open': state.applications.detail = state.applications.detail === id ? null : id; clearMessages(); render(); return;
        case 'pay-new': state.payments.form = true; clearMessages(); render(); return;
        case 'cancel-payment': state.payments.form = null; render(); return;
        case 'pay-verify': act(authed('api_verifyPayment', id, el.getAttribute('data-decision')), 'Payment updated.', loadPayments); return;
        case 'admin-tab': state.admin.tab = el.getAttribute('data-tab'); state.admin.form = null; clearMessages(); loadAdmin(); return;
        case 'admin-new': state.admin.form = {}; clearMessages(); render(); return;
        case 'admin-edit': var rec = findIn(state.admin.rows, id); if (rec) { state.admin.form = JSON.parse(JSON.stringify(rec)); clearMessages(); render(); } return;
        case 'admin-delete': if (confirm('Delete this record?')) act(authed('api_deleteRef', state.admin.tab, id), 'Deleted.', loadAdmin); return;
        case 'admin-cancel': state.admin.form = null; render(); return;
        case 'change-pw': state.pwForm = true; clearMessages(); render(); return;
        case 'cancel-pw': state.pwForm = false; render(); return;
        case 'user-new': state.users.form = { role: 'TEACHER' }; state.users.flash = null; clearMessages(); render(); return;
        case 'user-cancel': state.users.form = null; state.users.flash = null; render(); return;
        case 'user-activate': act(authed('api_setUserActive', id, true), 'User activated.', loadUsers); return;
        case 'user-deactivate': var ut = findIn(state.users.list, id); if (ut && (ut.active === false || confirm('Deactivate ' + ut.username + '? They will be signed out and unable to sign in.'))) act(authed('api_setUserActive', id, false), 'User deactivated.', loadUsers); return;
        case 'user-reset': var ur = findIn(state.users.list, id); if (ur && confirm('Send ' + ur.username + ' a new password? Their current sessions will be ended.')) { state.busy = true; clearMessages(); render(); authed('api_resetUserPassword', id).then(function (r) { state.users.flash = { message: r.message, password: r.password || '' }; state.busy = false; loadUsers(); }).catch(function (err) { state.busy = false; setError(err); }); } return;
        case 'ann-new': state.announcements.form = true; clearMessages(); render(); return;
        case 'cancel-ann': state.announcements.form = false; render(); return;
        case 'ann-delete': if (confirm('Delete this announcement?')) act(authed('api_deleteAnnouncement', id), 'Deleted.', loadAnnouncements); return;
        case 'receipt-open': state.busy = true; clearMessages(); render(); authed('api_getReceipt', id).then(function (res) { state.receipt = res; state.busy = false; render(); }).catch(function (err) { state.busy = false; setError(err); }); return;
        case 'receipt-print': printReceipt(); return;
        case 'receipt-close': state.receipt = null; render(); return;
        case 'fees-save': saveFeeSelection(); return;
        case 'fees-pay': state.payments.form = { studentId: state.fees.wardId, termId: state.fees.termId }; navigate('payments'); return;
        case 'fees-print-sheet': printFeeSheet(); return;
        case 'fee-new': state.fees.form = { category: 'TUITION', mandatory: false, active: true, orderIndex: 0 }; clearMessages(); render(); return;
        case 'fee-cancel': state.fees.form = null; render(); return;
        case 'fee-edit': var ffe = findIn(state.fees.list, id); if (ffe) { state.fees.form = JSON.parse(JSON.stringify(ffe)); clearMessages(); render(); } return;
        case 'fee-delete': if (confirm('Delete this fee/charge? Parents\u2019 saved selections for it remain in the log.')) act(authed('api_deleteFee', id), 'Fee deleted.', loadFees); return;
        case 'fees-save-settings': var ems = String((document.querySelector('[data-field="adm-emails"]') || {}).value || ''); act(authed('api_saveSettings', { ADMISSION_NOTIFY_EMAILS: ems.split(/[,;\s]+/).filter(Boolean).join(', ') }), 'Settings saved.', loadFees); return;
      }
    });
    function act(promise, notice, reload) { state.busy = true; clearMessages(); render(); promise.then(function () { state.notice = notice; state.busy = false; reload(); }).catch(function (err) { state.busy = false; setError(err); }); }
    document.addEventListener('change', function (e) {
      var t = e.target, f = t.getAttribute && t.getAttribute('data-field');
      if (f === 'students-class') { state.students.classArmId = t.value; clearMessages(); loadStudents(); }
      else if (f === 'students-search') { state.students.search = t.value; loadStudents(); }
      else if (f === 'staff-search') { state.staff.search = t.value; loadStaff(); }
      else if (f === 'att-class') { state.attendance.classArmId = t.value; clearMessages(); loadRoster(); }
      else if (f === 'att-date') { state.attendance.date = t.value; clearMessages(); loadRoster(); }
      else if (f === 'res-class') { state.results.classArmId = t.value; state.results.subjectId = ''; state.results.sheet = null; state.results.studentId = ''; state.results.grades = null; clearMessages(); loadResults(); }
      else if (f === 'res-term') { state.results.termId = t.value; clearMessages(); loadResults(); }
      else if (f === 'res-subject') { state.results.subjectId = t.value; clearMessages(); loadResults(); }
      else if (f === 'res-student') { state.results.studentId = t.value; state.results.grades = null; clearMessages(); loadResults(); }
      else if (f === 'pay-status') { state.payments.status = t.value; clearMessages(); loadPayments(); }
      else if (f === 'fees-ward') { state.fees.wardId = t.value; state.fees.schedule = null; loadMyFees(); }
      else if (f === 'fees-term') { state.fees.termId = t.value; state.fees.schedule = null; loadMyFees(); }
      else if (f === 'fees-inst') { if (state.fees.schedule) { state.fees.schedule.installments = Number(t.value); state.fees.schedule.saved = false; render(); } }
      else if (t.hasAttribute && t.hasAttribute('data-fee')) { toggleFeeItem(t); }
      else if (t.getAttribute('data-action') === 'att-note') { setAttNote(t.getAttribute('data-sid'), t.value); }
    });
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (t.getAttribute && t.getAttribute('data-field') === 'dash-search') { scheduleDashSearch(t.value); return; }
      if (t.getAttribute('data-action') === 'att-note') setAttNote(t.getAttribute('data-sid'), t.value);
      if (t.getAttribute('data-score')) { var rowEl = t.closest('tr'), sid = t.getAttribute('data-sid'), total = 0; ['ca1', 'ca2', 'ca3', 'exam'].forEach(function (k) { var inp = rowEl.querySelector('[data-score="' + k + '"]'); total += inp && inp.value !== '' ? Number(inp.value) : 0; }); var cell = document.querySelector('[data-total-for="' + sid + '"]'); if (cell) cell.textContent = total; }
      if (t.getAttribute('data-gscore')) { var grow = t.closest('[data-grow]'), gsub = grow.getAttribute('data-grow'), gtotal = 0; ['ca1', 'ca2', 'ca3', 'exam'].forEach(function (k) { var inp = grow.querySelector('[data-gscore="' + k + '"]'); gtotal += inp && inp.value !== '' ? Number(inp.value) : 0; }); var gcell = document.querySelector('[data-gtotal-for="' + gsub + '"]'); if (gcell) gcell.textContent = gtotal; }
    });
    document.addEventListener('submit', function (e) {
      var form = e.target; e.preventDefault();
      if (form.id === 'login-form') doLogin(form);
      else if (form.id === 'student-form') saveStudent(form);
      else if (form.id === 'staff-form') saveStaff(form);
      else if (form.id === 'teacher-form') saveTeacher(form);
      else if (form.id === 'application-form') saveApplication(form);
      else if (form.id === 'payment-form') savePayment(form);
      else if (form.id === 'admin-form') saveAdmin(form);
      else if (form.id === 'ann-form') saveAnnouncement(form);
      else if (form.id === 'fee-form') saveFee(form);
      else if (form.id === 'remarks-form') saveRemarks(form);
      else if (form.id === 'user-form') addUserSubmit(form);
      else if (form.id === 'pw-form') changePwSubmit(form);
    });

    /* ---------------- form actions ---------------- */
    function doLogin(form) { state.busy = true; state.error = null; render(); call('api_login', form.username.value.trim(), form.password.value).then(function (r) { state.token = r.token; sessionStorage.setItem('kms_token', r.token); state.user = r.user; return authed('api_bootstrap'); }).then(afterBoot).catch(function (err) { state.busy = false; state.error = err.message; render(); }); }
    function collect(form) { var data = {}; form.querySelectorAll('[name]').forEach(function (el) { if (el.type !== 'file') data[el.getAttribute('name')] = el.value; }); if (form.getAttribute('data-id')) data.id = form.getAttribute('data-id'); return data; }
    function saveStudent(form) { var data = collect(form); state.busy = true; clearMessages(); render(); readFileInput(form.querySelector('[name=photo]')).then(function (file) { if (file) data.photo = file; return authed('api_saveStudent', data); }).then(function () { state.students.form = null; state.notice = 'Student saved.'; loadStudents(); }).catch(function (err) { state.busy = false; setError(err); }); }
    function saveStaff(form) { var data = collect(form); state.busy = true; clearMessages(); render(); readFileInput(form.querySelector('[name=photo]')).then(function (file) { if (file) data.photo = file; return authed('api_saveStaff', data); }).then(function () { state.staff.form = null; state.notice = 'Staff saved.'; loadStaff(); }).catch(function (err) { state.busy = false; setError(err); }); }
    function saveTeacher(form) {
      var data = collect(form);
      data.armIds = Array.prototype.slice.call(form.querySelectorAll('input[name="arm"]:checked')).map(function (c) { return c.value; });
      state.busy = true; clearMessages(); render();
      authed('api_saveTeacher', data).then(function (r) {
        state.teachers.form = null;
        if (r.password) state.teachers.flash = { message: r.message, password: r.password };
        else state.notice = r.message || (data.id ? 'Assignment saved.' : 'Teacher created.');
        state.busy = false; loadTeachers();
      }).catch(function (err) { state.busy = false; setError(err); });
    }
    function saveApplication(form) {
      var data = collect(form);
      state.busy = true; clearMessages(); render();
      authed('api_updateApplication', data.id, { status: data.status, remarks: data.remarks }).then(function () {
        state.notice = 'Application updated.'; state.busy = false; loadApplications();
      }).catch(function (err) { state.busy = false; setError(err); });
    }
    function savePayment(form) { var data = collect(form); state.busy = true; clearMessages(); render(); readFileInput(form.querySelector('[name=evidence]')).then(function (file) { if (file) data.evidence = file; return authed('api_savePayment', data); }).then(function () { state.payments.form = null; state.notice = 'Payment submitted.'; loadPayments(); }).catch(function (err) { state.busy = false; setError(err); }); }
    function saveAdmin(form) { act(authed('api_saveRef', state.admin.tab, collect(form)), 'Saved.', function () { state.admin.form = null; loadAdmin(); }); }
    function saveAnnouncement(form) { var data = collect(form); state.busy = true; clearMessages(); render(); authed('api_saveAnnouncement', data).then(function () { state.announcements.form = false; state.notice = 'Announcement posted.'; loadAnnouncements(); }).catch(function (err) { state.busy = false; setError(err); }); }
    function saveFee(form) { var data = collect(form); data.mandatory = data.mandatory === 'true'; data.active = data.active === 'true'; state.busy = true; clearMessages(); render(); authed('api_saveFee', data).then(function () { state.fees.form = null; state.notice = 'Fee / charge saved. Parents will see it on their next schedule.'; loadFees(); }).catch(function (err) { state.busy = false; setError(err); }); }
    function saveRemarks(form) { state.busy = true; clearMessages(); render(); authed('api_saveRemarks', state.report.studentId, state.report.termId || state.results.termId, { teacherRemark: form.teacherRemark.value, principalRemark: form.principalRemark.value }).then(function () { state.notice = 'Remarks saved.'; loadReport(); }).catch(function (err) { state.busy = false; setError(err); }); }
    function setAttStatus(sid, status) { var r = state.attendance.roster; if (!r) return; r.students.forEach(function (x) { if (x.studentId === sid) x.status = status; }); var tr = document.querySelector('tr[data-sid="' + sid + '"]'); if (tr) tr.querySelectorAll('[data-action="att-status"]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-status') === status); }); }
    function setAttNote(sid, note) { var r = state.attendance.roster; if (r) r.students.forEach(function (x) { if (x.studentId === sid) x.note = note; }); }
    function saveAttendance() { var r = state.attendance.roster; if (!r) return; var records = r.students.map(function (x) { return { studentId: x.studentId, status: x.status, note: x.note }; }); act(authed('api_saveAttendance', state.attendance.classArmId, state.attendance.date, records), 'Attendance saved.', loadRoster); }
    function saveScores() { var sh = state.results.sheet; if (!sh) return; var records = sh.rows.map(function (row) { var rec = { studentId: row.studentId }; ['ca1', 'ca2', 'ca3', 'exam'].forEach(function (k) { var inp = document.querySelector('[data-score="' + k + '"][data-sid="' + row.studentId + '"]'); rec[k] = inp ? inp.value : ''; }); return rec; }); act(authed('api_saveScores', state.results.termId, state.results.classArmId, state.results.subjectId, records), 'Scores saved — result sheets updated.', loadResults); }
    function saveGrades() { var g = state.results.grades; if (!g || !g.subjects.length) return; var records = g.subjects.map(function (s) { var row = document.querySelector('[data-grow="' + s.subjectId + '"]'); var rec = { subjectId: s.subjectId }; ['ca1', 'ca2', 'ca3', 'exam'].forEach(function (k) { var inp = row ? row.querySelector('[data-gscore="' + k + '"]') : null; rec[k] = inp ? inp.value : ''; }); return rec; }); var name = fullName(g.student); act(authed('api_saveStudentGrades', g.student.id, g.term.id, records), 'Grades saved for ' + name + ' — result generated automatically.', function (d) { state.results.grades = d; state.busy = false; render(); }); }

    start();
  </script>
</body>
</html>
